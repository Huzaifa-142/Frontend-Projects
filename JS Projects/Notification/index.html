<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
    <style>
        body {
            display: flex;
            justify-content: space-between;
        }

        #btn {
            background-color: aquamarine;
            height: 30px;
            width: 200px;
            border: 1px solid black;
            font-size: 18px;
            cursor: pointer;
        }

        #btn:hover {
            background-color: rgb(29, 170, 123);
            color: white;
        }

        .three {
            height: 80px;
            width: 450px;
            background-color: black;
            border-radius: 10px;
            position: relative;
            display: none;
        }

        p {
            color: white;
            font-size: 1.6rem;
            padding-left: 20px;
        }

        #two {
            height: 10px;
            width: 100%;
            background-color: rgb(124, 207, 124);
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .anm {
            animation: uzair 3s ease-in-out 0s 1 normal;
        }

        @keyframes uzair {
            from {
                width: 100%;
            }

            to {
                width: 0%;
            }
        }
    </style>
</head>

<body>
    <button id="btn">Send Notification</button>
    <div id="one" class="three">
        <p>Notification Sent Successfully!</p>
        <div id="two"></div>
    </div>
    <script>
        var btn = document.getElementById("btn");
        var one = document.getElementById("one");
        var two = document.getElementById("two");

        btn.addEventListener("click", () => {
            one.style.display = "block";
            two.classList.add("anm");

            setTimeout(() => {
                one.style.display = "none";
            }, 3000);
        })
    </script>
</body>

</html>
