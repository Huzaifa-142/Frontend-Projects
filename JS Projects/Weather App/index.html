<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- 14°C -->
    <div id="parent">
        <div id="src">
            <input type="search" id="search" placeholder="Enter City Name" autofocus autocomplete="on">
            <div id="icon">
                <i class="bi bi-search" id="ficon"></i>
            </div>
        </div>
        <div id="sun">
            <i class="bi bi-brightness-high-fill" id="son"></i>
        </div>
        <h1 class="head1">temp</h1>
        <p id="head2">City</p>
        <p id="pk">Country</p>
        <div id="last">
            <div id="humidity">
                <i class="bi bi-water"></i>
                <div class="hp">
                    <p class="para" id="p1"><b id="b1">50%</b></p>
                    <p id="para2">Humidity</p>
                </div>
            </div>
            <div id="wind">
                <i class="bi bi-wind"></i>
                <div class="hp">
                    <p class="para" id="p2"><b>15 km/h</b></p>
                    <p class="para2">Wind Speed</p>
                </div>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
