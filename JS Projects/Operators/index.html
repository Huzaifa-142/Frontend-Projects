<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>

<body>
    <script>

        // Arithmetic Operators
        var a = 10;
        var b = 5;
        var sum = a + b;
        var sub = a - b;
        var mult = a * b;
        var dev = a / b;
        var mod = a % b;
        var pow = a ** b;
        document.write("<h1>Arthmetic Operators</h1>")
        document.write('a + b = ' + sum, " ", '(', typeof(sum) , ')')
        document.write("<br>")
        document.write('a - b = ' + sub, " ", '(', typeof(sub) , ')')
        document.write("<br>")
        document.write('a * b = ' + mult, " ", '(', typeof(mult) , ')')
        document.write("<br>")
        document.write('a / b = ' + dev, " ", '(', typeof(dev) , ')')
        document.write("<br>")
        document.write('a % b = ' + mod, " ", '(', typeof(mod) , ')')
        document.write("<br>")
        document.write('a ** b = ' + pow, " ", '(', typeof(pow) , ')')

        // Comparison operators

        document.write("<h1>Comparison Operators</h1>")
        var c = a < b;
        var d = a > b;
        var e = a <= b;
        var f = a >= b;
        var g = a == b;
        var h = a === b;
        document.write('a < b = ' + c, " ", '(', typeof(c) , ')')
        document.write("<br>")
        document.write('a > b = ' + d, " ", '(', typeof(d) , ')')
        document.write("<br>")
        document.write('a <= b = ' + e, " ", '(', typeof(e) , ')')
        document.write("<br>")
        document.write('a >= b = ' + f, " ", '(', typeof(f) , ')')
        document.write("<br>")
        document.write('a == b = ' + g, " ", '(', typeof(g) , ')')
        document.write("<br>")
        document.write('a === b = ' + h, " ", '(', typeof(h) , ')')
    </script>
</body>

</html>
